<!doctype html>
<html lang="en">
  <head>
    <!-- Charset & Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title (Primary for SEO) -->
    <title>Purple Meet | Online Video Meetings & Collaboration</title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="Purple Meet is a fast, secure, and reliable online meeting platform. Host video conferences, collaborate with your team, and connect anywhere—no downloads required."
    />

    <!-- Keywords (optional, less important for modern SEO but still usable) -->
    <meta
      name="keywords"
      content="Purple Meet, online meeting, video conferencing, free video calls, virtual meetings, team collaboration, secure meetings"
    />

    <!-- Robots (SEO Crawling) -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Purple Meet | Free Online Video Meetings" />
    <meta
      property="og:description"
      content="Host secure online meetings with Purple Meet. Free video conferencing, team collaboration, and screen sharing made simple."
    />
    <meta property="og:image" content="https://yourdomain.com/meeting.png" />
    <meta property="og:url" content="https://yourdomain.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Purple Meet | Free Online Video Meetings" />
    <meta
      name="twitter:description"
      content="Free, secure, and reliable online meetings. Start your Purple Meet today."
    />
    <meta name="twitter:image" content="https://yourdomain.com/meeting.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://yourdomain.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/meeting.png" />

    <!-- Accessibility & Branding -->
    <meta name="theme-color" content="#6b46c1" />
  </head>

  <body>
    <noscript>
      <p>
        Purple Meet requires JavaScript to run. Please enable it in your
        browser to join or host meetings.
      </p>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
